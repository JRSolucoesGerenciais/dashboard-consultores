name: Sincronização diária (23h Brasília)

on:
  schedule:
    # 23:00 em Brasília (UTC-3, sem horário de verão) = 02:00 UTC
    - cron: "0 2 * * *"
  workflow_dispatch: {}

concurrency:
  group: daily-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Sincronizar API CSAgenda e gravar foto do dia
        run: pnpm sync:daily
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ORACLE_API_TOKEN: ${{ secrets.ORACLE_API_TOKEN }}
